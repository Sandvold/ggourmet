[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/arkiv"
  to = "/arkiv.html"
  status = 200

[[redirects]]
  from = "/viner"
  to = "/viner.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
